name: Source health and registry checks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_source_health.py --offline
      - run: python3 scripts/validate_state_ut_source_registry.py
      - run: python3 scripts/validate_verified_source_registry.py
      - run: python3 scripts/build_matter_index.py --check
  network-health-report:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_source_health.py --timeout 20 | tee source-health-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: source-health-report
          path: source-health-report.txt
